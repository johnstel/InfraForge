name: Deploy backend demo app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment to deploy into"
        required: false
        default: "demo"
      app_service_name:
        description: "Optional override for Azure App Service name"
        required: false
        default: ""
      health_check_base_url:
        description: "Optional override for smoke-check base URL (e.g. https://demo.contoso.com)"
        required: false
        default: ""
      health_check_path:
        description: "Health endpoint path for smoke check"
        required: false
        default: "/api/health?check=backend_api"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build validation
        run: python -m compileall src web_start.py start.py

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Package backend app
        run: |
          zip -r backend-app.zip \
            src \
            static \
            web_start.py \
            start.py \
            requirements.txt

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Resolve app service name
        env:
          INPUT_APP_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.app_service_name || '' }}
          VAR_APP_NAME: ${{ vars.BACKEND_APP_SERVICE_NAME }}
        run: |
          APP_NAME="${INPUT_APP_NAME:-$VAR_APP_NAME}"
          if [ -z "$APP_NAME" ]; then
            echo "Missing backend app name. Resolution order is: workflow input 'app_service_name' first, then variable 'BACKEND_APP_SERVICE_NAME' from the selected environment/repository scope."
            exit 1
          fi
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: backend-app.zip

      - name: Smoke check backend health endpoint
        env:
          MANUAL_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.health_check_base_url || '' }}
          HEALTH_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.health_check_path || '/api/health?check=backend_api' }}
          DEPLOYED_WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          BASE_URL="${MANUAL_BASE_URL:-$DEPLOYED_WEBAPP_URL}"
          if [ -z "$BASE_URL" ]; then
            echo "Smoke check failed: no base URL available. Provide workflow input 'health_check_base_url' or ensure deploy step emits 'webapp-url'."
            exit 1
          fi
          NORMALIZED_HEALTH_PATH="${HEALTH_PATH#/}"
          HEALTH_URL="${BASE_URL%/}/${NORMALIZED_HEALTH_PATH}"
          echo "Running smoke check: $HEALTH_URL"
          set +e
          HTTP_STATUS="$(curl --silent --show-error --location --retry 5 --retry-delay 5 --output /tmp/health-response.json --write-out '%{http_code}' "$HEALTH_URL")"
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Smoke check request failed for $HEALTH_URL (curl exit code: $CURL_EXIT). Verify App Service is running and review logs in Azure Portal > App Service > Log stream (or az webapp log tail)."
            exit 1
          fi
          if ! [[ "$HTTP_STATUS" =~ ^[0-9]{3}$ ]]; then
            echo "Smoke check failed for $HEALTH_URL: unexpected HTTP status token '$HTTP_STATUS'."
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Smoke check failed for $HEALTH_URL with HTTP status $HTTP_STATUS."
            if [ -f /tmp/health-response.json ]; then
              echo "Response body:"
              cat /tmp/health-response.json
            fi
            exit 1
          fi
          RESPONSE="$(cat /tmp/health-response.json)"
          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os
          import sys

          response = os.environ["RESPONSE"]
          try:
              payload = json.loads(response)
          except json.JSONDecodeError as exc:
              preview = response[:500]
              print(f"Smoke check failed: health endpoint returned invalid JSON ({exc}). Raw response (first 500 chars of {len(response)}): {preview}")
              sys.exit(1)

          # /api/health?check=backend_api returns {"result":{"status":"..."}}
          # while full health responses may return {"overall":"..."}.
          status = payload.get("result", {}).get("status")
          if status is None:
              status = payload.get("overall")
          if status != "healthy":
              print(f"Smoke check failed. Parsed status={status!r}, payload={payload}")
              sys.exit(1)

          print("Smoke check passed.")
          PY
