name: Deploy backend demo app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment to deploy into"
        required: false
        default: "demo"
      app_service_name:
        description: "Optional override for Azure App Service name"
        required: false
        default: ""
      health_check_base_url:
        description: "Optional override for smoke-check base URL (e.g. https://demo.contoso.com)"
        required: false
        default: ""
      health_check_path:
        description: "Health endpoint path for smoke check"
        required: false
        default: "/api/health?check=backend_api"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build validation
        run: python -m compileall src web_start.py

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Package backend app
        run: |
          zip -r backend-app.zip \
            src \
            static \
            web_start.py \
            start.py \
            requirements.txt

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Resolve app service name
        env:
          INPUT_APP_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.app_service_name || '' }}
          VAR_APP_NAME: ${{ vars.BACKEND_APP_SERVICE_NAME }}
        run: |
          APP_NAME="${INPUT_APP_NAME:-$VAR_APP_NAME}"
          if [ -z "$APP_NAME" ]; then
            echo "Missing backend app name. Set workflow input 'app_service_name' or repository variable 'BACKEND_APP_SERVICE_NAME'."
            exit 1
          fi
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: backend-app.zip

      - name: Smoke check backend health endpoint
        env:
          MANUAL_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.health_check_base_url || '' }}
          HEALTH_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.health_check_path || '/api/health?check=backend_api' }}
          DEPLOYED_WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          BASE_URL="${MANUAL_BASE_URL:-$DEPLOYED_WEBAPP_URL}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://${APP_NAME}.azurewebsites.net"
          fi
          HEALTH_URL="${BASE_URL%/}${HEALTH_PATH}"
          echo "Running smoke check: $HEALTH_URL"
          RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 "$HEALTH_URL")"
          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os
          import sys

          response = os.environ["RESPONSE"]
          payload = json.loads(response)

          status = payload.get("result", {}).get("status") or payload.get("overall")
          if status != "healthy":
              print(f"Smoke check failed. Parsed status={status!r}, payload={payload}")
              sys.exit(1)

          print("Smoke check passed.")
          PY
